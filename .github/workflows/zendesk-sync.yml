name: Sync Docs to Zendesk Sandbox
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # 🔐 Defining env at the job level makes them bulletproof for the script runner
    env:
      ZENDESK_SUBDOMAIN: ${{ secrets.ZD_SUBDOMAIN }}
      ZENDESK_EMAIL: ${{ secrets.ZD_EMAIL }}
      ZENDESK_API_TOKEN: ${{ secrets.ZD_TOKEN }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Markdown and HTTP packages
        run: npm install axios marked

      - name: Execute Zendesk Sync Script
        run: node sync.js

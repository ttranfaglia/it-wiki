name: Sync Docs to Zendesk Sandbox
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**.md'
  workflow_dispatch: # Allows manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Markdown and HTTP packages
        run: npm install axios marked

      - name: Execute Zendesk Sync Script
        env:
          # 🔐 This tells GitHub to map your exact Repository Secrets directly to these variables
          ZENDESK_SUBDOMAIN: ${{ secrets.ZD_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZD_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZD_TOKEN }}
        run: node sync.js

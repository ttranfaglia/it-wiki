name: Sync Docs to Zendesk
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**.md' # Only runs when files in your docs folder change

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios marked

      - name: Run Sync Script
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZD_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZD_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZD_TOKEN }}
        run: node sync.js
